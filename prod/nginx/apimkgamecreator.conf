# Backend (Fastify) - apimkgamecreator.unifyhub.com.br
# Servidor: 187.77.53.197
#
# Instalar:
#   sudo cp apimkgamecreator.conf /etc/nginx/sites-available/apimkgamecreator.conf
#   sudo ln -s /etc/nginx/sites-available/apimkgamecreator.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d apimkgamecreator.unifyhub.com.br
#
# O bloco abaixo e so HTTP (porta 80). O certbot reescreve este arquivo
# automaticamente para adicionar o bloco HTTPS (porta 443) e o redirect.
# Nao adicione o bloco SSL manualmente - deixe o certbot fazer isso.
#
# client_max_body_size 10m casa com o limite de upload do backend
# (@fastify/multipart, 10MB) e da validacao no frontend.

server {
    listen 80;
    listen [::]:80;
    server_name apimkgamecreator.unifyhub.com.br;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
