# Frontend (Next.js) - mkgamecreator.unifyhub.com.br
# Servidor: 76.13.175.38
#
# Instalar:
#   sudo cp mkgamecreator.conf /etc/nginx/sites-available/mkgamecreator.conf
#   sudo ln -s /etc/nginx/sites-available/mkgamecreator.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mkgamecreator.unifyhub.com.br
#
# O bloco abaixo e so HTTP (porta 80). O certbot reescreve este arquivo
# automaticamente para adicionar o bloco HTTPS (porta 443) e o redirect.
# Nao adicione o bloco SSL manualmente - deixe o certbot fazer isso.

server {
    listen 80;
    listen [::]:80;
    server_name mkgamecreator.unifyhub.com.br;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
