services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mkgamecreator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mkgamecreator}
      POSTGRES_DB: ${POSTGRES_DB:-mkgamecreator}
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mkgamecreator}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mkgamecreator}:${POSTGRES_PASSWORD:-mkgamecreator}@postgres:5432/${POSTGRES_DB:-mkgamecreator}?schema=public
      PORT: 3333
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3333:3333"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    env_file:
      - path: ./apps/web/.env
        required: false
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3333
      API_INTERNAL_URL: http://backend:3333
      WATCHPACK_POLLING: "true"
    ports:
      - "3050:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_node_modules:
  backend_uploads:
  web_node_modules:
  web_next_cache:
